server:
  port: 8080

spring:
  application:
    name: ai-marking-system

  # ==================== 数据源（MyBatis-Plus 依赖它） ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 全部支持环境变量覆盖，别人克隆仓库后无需改代码即可接入自己的本地环境
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_marking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:20060302}
    hikari:
      # 连接池最大/最小连接数，按需调整
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ==================== 文件上传 ====================
  # Spring Boot 默认单文件 1MB / 单请求 10MB，必然不够用：
  # - 后续阶段题库/成绩的 EasyExcel 批量导入
  # - 纸质试卷模式的答题卡扫描件（图片）上传
  # 故在此显式调大，按需调整
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      # 没有密码时留空即可
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ==================== RabbitMQ（模块4：异步AI阅卷 / OCR识别） ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # guest 账号默认只允许 localhost 连接；远程部署需在 RabbitMQ 中新建账号并授权该 vhost
    virtual-host: /
    connection-timeout: 5s
    # ---- 生产者：发布确认，保证"消息确实到达交换机/队列" ----
    # correlated：异步回调确认（ConfirmCallback），消息没到交换机会收到 nack
    publisher-confirm-type: correlated
    # 交换机路由不到任何队列时，把消息退回给生产者（ReturnCallback），否则消息被静默丢弃
    publisher-returns: true
    template:
      # 与 publisher-returns 配合：路由失败时退回而不是直接丢弃
      mandatory: true
    # ---- 消费者：手动 ack + 限流 + 失败不重新入队 ----
    listener:
      simple:
        # manual：业务处理成功才 ack，异常时 nack；避免 auto 模式下"拿到消息就算成功"导致任务丢失
        acknowledge-mode: manual
        # 每个消费者一次最多预取 5 条，防止慢消费（AI调用耗时长）时消息全部堆积在单个消费者本地
        prefetch: 5
        # 并发消费者数量区间，AI 阅卷耗时较长，不宜开太大，按需调整
        concurrency: 2
        max-concurrency: 5
        # 消费失败（nack/reject）时不重新入队，直接按队列的死信配置转发到死信交换机；
        # 重试次数由业务侧 mark_task.retry_count 控制，避免异常消息在队列里无限循环
        default-requeue-rejected: false

# ==================== 试卷上传解析（模块：试卷管理） ====================
# PDF 使用 PDFBox 提取文本层；图片走可插拔 OCR HTTP 接口。
# 未配置 ocr-url 时图片仍会上传成功，但解析结果会提示"请手动录入题目"。
# 本地离线 OCR：cd tools/ocr-server && pip install -r requirements.txt
#   开发启动：python server.py
#   生产启动：gunicorn -c gunicorn.conf.py server:app（多进程 + 多线程，单进程并发上限见 OCR_MAX_CONCURRENCY）
# 然后设置 PAPER_OCR_URL=http://localhost:9100/ocr 并重启后端即可识别中文试卷/答卷图片。
paper-parse:
  # 试卷/题目上传解析是否调用大模型，默认 false：
  # false = 只用本地 OCR + 规则拆分，完全免费、不发起任何大模型请求；
  # true  = 规则失败时才调大模型（可在「大模型设置」填免费模型的 Key 与地址）。
  llm-enabled: ${PAPER_PARSE_LLM_ENABLED:false}
  # OCR 服务地址，留空表示未配置（本地服务：http://localhost:9100/ocr）
  ocr-url: ${PAPER_OCR_URL:}
  # OCR 服务鉴权 Key，留空则不发送鉴权头
  ocr-api-key: ${PAPER_OCR_API_KEY:}
  # 近重复图片判定：dHash 汉明距离 ≤ 该值视为同一页（重拍/压缩/轻微旋转可识别），0 关闭
  duplicate-hamming-distance: ${PAPER_PARSE_DUPLICATE_DISTANCE:6}
  # 单次解析任务的总时长预算（秒），超出后剩余图片标记失败，避免个别图片无限拖延
  task-timeout-seconds: ${PAPER_PARSE_TASK_TIMEOUT:120}
  # 多页文本去重：题号相同且题干相似度达到该值视为同一题
  merge-similarity: ${PAPER_PARSE_MERGE_SIMILARITY:0.58}
  # 单文件大小上限，与 spring.servlet.multipart 保持一致
  max-file-size: 20MB

# ==================== AI 阅卷（模块4：题目批改） ====================
mark:
  # 主观题评分采样次数：2 = 双采样一致性校验（两次偏差超过满分 10% 标记人工复核）；
  # 1 = 单次调用，节省大模型额度
  subjective-samples: ${MARK_SUBJECTIVE_SAMPLES:2}
  # 任务补偿：停在待消费/处理中超过该分钟数视为执行中断，由定时任务自动重新投递
  task-timeout-minutes: ${MARK_TASK_TIMEOUT_MINUTES:15}
  # 失败待重试(3)的任务冷却多久后自动重投，避免刚失败就立刻重试
  retry-backoff-minutes: ${MARK_RETRY_BACKOFF_MINUTES:3}
  # 补偿扫描间隔（毫秒），默认 5 分钟；首次延迟 1 分钟
  recovery-interval-ms: ${MARK_RECOVERY_INTERVAL_MS:300000}
  recovery-initial-delay-ms: ${MARK_RECOVERY_INITIAL_DELAY_MS:60000}

# ==================== LLM（模块4：AI阅卷 / OCR后处理 / Prompt模板） ====================
# 当前默认使用 DeepSeek 官方 API，后续若接入智谱/通义等，只需调整 provider 标识与 api-url，
# DeepSeekLlmUtil.chat() 的签名完全不变，业务侧无需改代码。
llm:
  # 厂商标识：deepseek / zhipu / qwen...，仅作日志与异常区分，不影响逻辑
  provider: deepseek
  # API 端点：DeepSeek Chat Completions 标准地址
  api-url: https://api.deepseek.com/chat/completions
  # 默认模型名：deepseek-chat（V3），可按需换 deepseek-reasoner（R1 推理模型）
  model: deepseek-chat
  # API Key：**生产环境务必用环境变量覆盖，示例：-Dllm.api-key=${DEEPSEEK_API_KEY}**
  # 提交到 Git 前请清空或替换为空字符串；本地开发用占位值（不真实调用时没问题）
  api-key:

# ==================== JWT ====================
jwt:
  # HS256 要求密钥至少 32 字节；生产环境务必通过环境变量覆盖，不要把真实密钥提交到仓库
  secret: ${JWT_SECRET:ai-marking-system-jwt-secret-key-2026-please-change-in-production}
  # token 有效期，单位毫秒，当前为 30 分钟（同时作为 Redis 会话的 TTL）
  expiration: 1800000

# ==================== MyBatis-Plus ====================
mybatis-plus:
  # XML 映射文件位置，后续按模块放 mapper 目录即可被自动扫描
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径，后续各业务模块的 entity 都会被识别（** 支持多级通配）
  type-aliases-package: com.marking.aimarkingsystem.**.entity
  configuration:
    # 数据库下划线字段自动映射到 Java 驼峰属性，如 create_time -> createTime
    map-underscore-to-camel-case: true
    # 开发阶段打印执行的 SQL，上线时请删除或改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 与建表 SQL 中的 BIGINT AUTO_INCREMENT 保持一致
      id-type: auto
      # 逻辑删除字段（实体中属性名 delFlag），1 已删除 / 0 未删除
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== MinIO 对象存储 ====================
minio:
  # MinIO 服务地址，末尾不要带斜杠；生产环境用环境变量覆盖
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  # 存放答卷图片/扫描件的桶；首次上传时若不存在会自动创建
  bucket: ai-marking
  # 预签名 URL 有效期（秒），默认 1 小时。
  # 桶保持私有（private）+ 短时效签名直链，即为"防盗链"的核心手段：
  # 链接过期后无法再访问，也无法被其他站点长期盗用
  presigned-expiry: 3600

# 文件存储回退：未启动 MinIO（如面试演示环境）时把文件落本地磁盘，
# 由后端 /files/** 直出，前端拿到的地址为 /api/files/xxx，无需改任何页面。
storage:
  fallback-to-local: true
  local-dir: ./data/uploads
  local-url-prefix: /api/files

# ==================== Sentinel（MQ 消费限流 + 大模型熔断） ====================
# 规则由 SentinelConfig 在启动时用 FlowRuleManager / DegradeRuleManager 加载，不依赖 Dashboard。
# 每个阈值都可用同名环境变量覆盖，便于不同部署环境调整而无需改代码。
sentinel:
  # AI 阅卷消费者每秒最多进入的条数（超出走 markFailed + 死信，由定时补偿任务削峰）
  ai-mark-qps: ${SENTINEL_AI_MARK_QPS:5}
  # OCR 消费者每秒最多进入的条数
  ocr-qps: ${SENTINEL_OCR_QPS:5}
  # 大模型调用每秒最多请求数
  llm-qps: ${SENTINEL_LLM_QPS:10}
  # 熔断：统计窗口内异常比例达到该值即熔断（0.5 = 50%）
  llm-error-ratio: ${SENTINEL_LLM_ERROR_RATIO:0.5}
  # 熔断：窗口内最小请求数，样本不足时不熔断
  llm-min-request-amount: ${SENTINEL_LLM_MIN_REQUEST:5}
  # 熔断：统计窗口长度（毫秒）
  llm-stat-interval-ms: ${SENTINEL_LLM_STAT_INTERVAL_MS:10000}
  # 熔断：熔断持续秒数，到期后半开探测恢复
  llm-degrade-seconds: ${SENTINEL_LLM_DEGRADE_SECONDS:30}

# ==================== 接口限流（模块7：Redis 滑动窗口） ====================
# 说明：本阶段只提供 RedisSlidingWindowLimiter 工具类，默认不拦截任何接口，
#       因此这里只定义"默认参数"，由业务侧调用时显式传入，避免每个接口硬编码。
# 典型用法（后续在登录/提交答卷/AI讲评等接口或拦截器中调用）：
#   limiter.tryAcquire("rate_limit:login:ip:" + ip, 5, 60)
#   limiter.tryAcquire("rate_limit:ai-report:user:" + userId, 3, 600)
# 参数含义：
# - default-limit：默认窗口内最大请求数；
# - default-window-seconds：默认窗口长度（秒）；
# - key-prefix：限流 key 统一前缀，便于 Redis 运维检索与清理。
rate-limit:
  enabled: true
  key-prefix: "rate_limit:"
  default-limit: 20
  default-window-seconds: 60

# ==================== 日志（模块7：操作日志切面 + 文件滚动） ====================
# 操作日志切面 OperationLogAspect 使用 SLF4J 输出到应用日志，
# 这里统一定义日志级别、输出文件与滚动策略，避免日志无限增长占满磁盘。
# - com.marking.aimarkingsystem=debug：开发阶段便于查看业务细节，生产可调为 info；
# - file.name：日志文件路径，相对项目启动目录；
# - max-file-size / max-history / total-size-cap：单文件 50MB、保留 30 天、总量 2GB；
# - console pattern 带毫秒与线程名，便于排查并发与慢接口。
logging:
  level:
    root: info
    com.marking.aimarkingsystem: debug
  file:
    name: logs/ai-marking-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB
