# ============================================================================
# AI 阅卷系统 Nginx 网关（多副本扩容 + WebSocket 透传 + 失败切副本）
#
# 拓扑：
#   浏览器 ──▶ Nginx :80 ──┬──▶ /api/  → app_cluster  (Spring Boot 8080 / 8081 ...)
#                          ├──▶ /ws/   → app_cluster  (WebSocket，需透传 Upgrade)
#                          ├──▶ /ocr   → ocr_cluster  (Flask/gunicorn 9100 / 9101 ...)
#                          └──▶ /      → 前端 dist 静态文件（history 路由回退）
#
# 扩容方式：在对应 upstream 里加一行 server 即可，无需改前端/后端代码。
# 后端无状态（会话在 Redis、任务在 MySQL/MQ）才能安全多副本，本项目已满足。
# ============================================================================

worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # 上传大文件（扫描件/Excel 导入）时的临时目录与缓冲
    client_body_temp_path  /var/cache/nginx/client_temp;
    client_max_body_size   100m;

    # WebSocket：把 Upgrade 头原样透传，Close 时 Connection 置空，避免长连接被复用错乱
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ---------- 后端集群（无状态 Spring Boot） ----------
    upstream app_cluster {
        # least_conn：把新请求交给当前连接数最少的副本，长任务（AI 阅卷接口）场景比轮询更均衡
        least_conn;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        # 与后端保持长连接，减少每次请求的 TCP 握手
        keepalive 32;
    }

    # ---------- OCR 集群（Flask + gunicorn） ----------
    upstream ocr_cluster {
        least_conn;
        server 127.0.0.1:9100 max_fails=2 fail_timeout=15s;
        server 127.0.0.1:9101 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        # ---------- 前端静态资源 ----------
        # 构建：cd frontend && npm run build，把 dist 拷到下面 root 指向的目录
        root   /usr/share/nginx/html;
        index  index.html;

        # 带 hash 的静态资源可长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---------- 业务 API ----------
        # proxy_pass 末尾带 / ：把浏览器的 /api/xxx 重写为后端的 /xxx，
        # 与 frontend/vite.config.js 里 rewrite: path.replace(/^\/api/, '') 保持一致。
        location /api/ {
            proxy_pass http://app_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # AI 阅卷/讲评接口可能耗时较长，读超时放宽到 180s
            proxy_connect_timeout 5s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
            proxy_buffering       off;

            # HTTP 级失败切副本：连接失败/超时/502/503/504 时换下一个副本重试一次。
            # 不包含 non_idempotent：POST 已被上游处理过时不盲目重发，避免重复建任务
            # （任务级重试由后端 mark_task.retry_count + MQ 死信保证，比 HTTP 重试更可靠）。
            proxy_next_upstream        error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries  2;
            proxy_next_upstream_timeout 10s;
        }

        # ---------- WebSocket 实时通知 ----------
        # 不做路径重写：后端 WebSocket 端点就是 /ws/mark。
        location /ws/ {
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;
            # 协议升级必须的两个头
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            # 长连接不做读超时，否则空闲一会儿就被 Nginx 断开
            proxy_connect_timeout 5s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            proxy_buffering       off;
            # 长连接不要被切到别的副本重试（升级成功后无法重放）
            proxy_next_upstream off;
        }

        # ---------- OCR 服务 ----------
        # 前端/后端不直接暴露 OCR 端口，统一走网关；路径保持 /ocr（不重写）。
        location = /ocr {
            proxy_pass http://ocr_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header Connection "";
            proxy_set_header X-API-Key  $http_x_api_key;

            client_max_body_size 20m;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            # OCR 单张图推理最坏几十秒，比后端 OcrClient 的 30s 读超时留足余量
            proxy_read_timeout    60s;

            # OCR 是只读识别、可安全重放：包含 non_idempotent，
            # 并且把 429（某副本引擎池已满）也当作"换副本重试"的信号。
            proxy_next_upstream         error timeout http_429 http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 10s;
        }

        # OCR 健康检查透传（运维探活）
        location = /ocr-health {
            proxy_pass http://ocr_cluster/health;
            proxy_set_header Host $host;
        }

        # ---------- 前端 history 路由回退 ----------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
